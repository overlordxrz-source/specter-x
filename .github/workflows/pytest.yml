name: pytest

# Automatic CI: main pushes and active pull requests only.
# Feature-branch pushes without a PR do not run this workflow. A pull request
# triggers one run per update; the concurrency group cancels superseded runs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pytest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip check
      - name: Run deterministic offline suite
        run: python -m pytest -q -m "not hardware"
      - name: Verify persistent context integrity
        run: python tools/check_context.py
